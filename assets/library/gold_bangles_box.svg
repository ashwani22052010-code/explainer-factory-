      <path d="M 180,530 L 820,530 L 790,710 C 790,765 715,810 500,810 C 285,810 210,765 210,710 Z" fill="url(#gold_bangles_box-tealBase)" stroke="#3A2418" stroke-width="7" stroke-linejoin="round" />

      
      <path d="M 230,550 L 770,550" fill="none" stroke="url(#gold_bangles_box-hiWhite)" stroke-width="6" stroke-linecap="round" opacity="0.5" />

      
      <ellipse cx="500" cy="550" rx="290" ry="70" fill="url(#gold_bangles_box-vInner)" stroke="#3A2418" stroke-width="6" />
      
      
      <path d="M 215,550 C 215,610 330,660 500,660 C 670,660 785,610 785,550 C 785,595 670,640 500,640 C 330,640 215,595 215,550 Z" fill="url(#gold_bangles_box-vLight)" stroke="#3A2418" stroke-width="5" />
      <ellipse cx="500" cy="565" rx="260" ry="50" fill="url(#gold_bangles_box-vDark)" stroke="#3A2418" stroke-width="5" />

      
      <path d="M 380,530 C 380,570 420,590 480,580" fill="none" stroke="#150E2B" stroke-width="8" stroke-linecap="round" />
      <path d="M 520,580 C 580,590 620,570 620,530" fill="none" stroke="#150E2B" stroke-width="8" stroke-linecap="round" />
    </g>

    
    <g data-part="clasp">
