    <g>
      
      <path d="M 640,430 Q 640,450 660,450 Q 640,450 640,470 Q 640,450 620,450 Q 640,450 640,430 Z" fill="#FFF8E8" stroke="#3A2418" stroke-width="3" stroke-linejoin="round">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      </path>
      
      <path d="M 350,470 Q 350,485 365,485 Q 350,485 350,500 Q 350,485 335,485 Q 350,485 350,470 Z" fill="#FFF8E8" stroke="#3A2418" stroke-width="2.5" stroke-linejoin="round">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
      </path>
      
      <circle cx="520" cy="435" r="5" fill="#FFF8E8" stroke="#3A2418" stroke-width="3" />
