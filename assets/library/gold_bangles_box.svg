      <ellipse cx="520" cy="554" rx="108" ry="42" fill="none" stroke="#3A2418" stroke-width="4" />
      
      
      <line x1="410" y1="540" x2="420" y2="570" stroke="#A5701B" stroke-width="4" stroke-linecap="round" />
      <line x1="440" y1="545" x2="450" y2="575" stroke="#A5701B" stroke-width="4" stroke-linecap="round" />
      <line x1="470" y1="548" x2="480" y2="578" stroke="#A5701B" stroke-width="4" stroke-linecap="round" />

      
      <ellipse cx="440" cy="530" rx="40" ry="9" fill="#FFF8E8" transform="rotate(-10 440 530)" />
      <ellipse cx="610" cy="565" rx="15" ry="5" fill="#FFF8E8" transform="rotate(15 610 565)" />
      <circle cx="580" cy="572" r="4" fill="#FFF8E8" />
