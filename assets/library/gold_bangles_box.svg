<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet">
  <defs>
    
    <linearGradient id="gold_bangles_box-vDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261A4D" />
      <stop offset="100%" stop-color="#150E2B" />
    </linearGradient>
    <linearGradient id="gold_bangles_box-vLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F3A8C" />
      <stop offset="100%" stop-color="#3A2A66" />
    </linearGradient>
    <linearGradient id="gold_bangles_box-vInner" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1B1236" />
      <stop offset="100%" stop-color="#2A1D52" />
    </linearGradient>

    
    <linearGradient id="gold_bangles_box-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C28929" />
      <stop offset="30%" stop-color="#E2A93B" />
      <stop offset="50%" stop-color="#F9D776" />
      <stop offset="70%" stop-color="#E2A93B" />
      <stop offset="100%" stop-color="#A5701B" />
