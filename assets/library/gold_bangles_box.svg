      <path d="M 185,420 C 185,190 320,110 500,110 C 680,110 815,190 815,420 C 815,425 810,430 805,430 C 700,390 600,380 500,380 C 400,380 300,390 195,430 C 190,430 185,425 185,420 Z" fill="url(#gold_bangles_box-tealBase)" stroke="#3A2418" stroke-width="6" stroke-linejoin="round" />
      
      
      <path d="M 215,415 C 215,205 330,135 500,135 C 670,135 785,205 785,415 C 785,420 780,425 775,425 C 675,395 585,390 500,390 C 415,390 325,395 225,425 C 220,425 215,420 215,415 Z" fill="url(#gold_bangles_box-vDark)" stroke="#3A2418" stroke-width="5" />
      
      
      <path d="M 500,165 L 560,240 L 500,315 L 440,240 Z" fill="url(#gold_bangles_box-vLight)" opacity="0.4" stroke="#3A2418" stroke-width="3" />
