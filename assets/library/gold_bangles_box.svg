      <ellipse cx="450" cy="533" rx="100" ry="38" fill="none" stroke="#3A2418" stroke-width="4" />
      
      <path d="M 360,520 C 370,550 420,565 470,555" fill="none" stroke="url(#gold_bangles_box-goldAlt)" stroke-width="8" />
      
      <ellipse cx="380" cy="510" rx="25" ry="6" fill="#FFF8E8" transform="rotate(-15 380 510)" />
      <circle cx="530" cy="545" r="4" fill="#FFF8E8" />
      <circle cx="410" cy="550" r="3" fill="#FFF8E8" />
    </g>

    
    <g transform="translate(15, -60)">
      <ellipse cx="500" cy="510" rx="115" ry="48" fill="none" stroke="url(#gold_bangles_box-gold)" stroke-width="26" stroke-linecap="round" />
      <ellipse cx="500" cy="513" rx="104" ry="40" fill="none" stroke="#3A2418" stroke-width="4" />
      
      <path d="M 395,500 Q 500,540 605,500" fill="none" stroke="#A5701B" stroke-width="3" stroke-dasharray="12,8" />
      
      <ellipse cx="560" cy="485" rx="35" ry="8" fill="#FFF8E8" transform="rotate(5 560 485)" />
      <circle cx="430" cy="525" r="5" fill="#FFF8E8" />
      <circle cx="450" cy="528" r="3" fill="#FFF8E8" />
