<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
    
    <defs>
        <linearGradient id="set_small_town_stree-skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#3A2A66" />
            <stop offset="60%" stop-color="#F08A3C" />
            <stop offset="100%" stop-color="#F1E3C2" />
        </linearGradient>
        <linearGradient id="set_small_town_stree-groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#E2A93B" />
            <stop offset="100%" stop-color="#C2603A" stop-opacity="0.6" />
        </linearGradient>
        <clipPath id="set_small_town_stree-frameClip">
            <rect width="1600" height="900" />
        </clipPath>
    </defs>

    
    <rect width="1600" height="900" fill="url(#set_small_town_stree-skyGrad)" />
    
    <g data-part="light">
        <circle cx="1300" cy="250" r="80" fill="#F08A3C" opacity="0.6">
            <animate attributeName="r" values="80;85;80" dur="5s" repeatCount="indefinite" />
        </circle>
        <circle cx="1300" cy="250" r="50" fill="#E2A93B" />
    </g>

    
    <path d="M0 600 L150 520 L300 580 L450 540 L600 590 L800 530 L1100 580 L1300 520 L1600 600 V900 H0 Z" fill="#3A2A66" opacity="0.3" />
    <path d="M0 650 L200 600 L400 640 L700 580 L1000 630 L1300 590 L1600 650 V900 H0 Z" fill="#1B2340" opacity="0.2" />

    
    <path d="M0 650 L1600 650 L1600 900 L0 900 Z" fill="#F1E3C2" />
    <path d="M0 650 L1600 650 L1600 750 L0 850 Z" fill="url(#set_small_town_stree-groundGrad)" opacity="0.4" />

    
    
    <g stroke="#3A2418" stroke-width="3" stroke-linejoin="round">
        <rect x="-50" y="400" width="400" height="450" fill="#1F6F6B" /> 
        <polygon points="-60,400 380,400 350,350 -60,350" fill="#C2603A" /> 
        <rect x="100" y="500" width="120" height="180" fill="#3A2A66" /> 
        <rect x="110" y="510" width="100" height="170" fill="none" stroke="#F1E3C2" stroke-width="2" />
        
        <rect x="250" y="480" width="80" height="100" fill="#F1E3C2" />
        <line x1="290" y1="480" x2="290" y2="580" />
        <line x1="250" y1="530" x2="330" y2="530" />
        
        <rect x="-20" y="750" width="300" height="60" fill="#C2603A" />
    </g>

    
    <g stroke="#3A2418" stroke-width="3" stroke-linejoin="round">
        <rect x="1250" y="350" width="400" height="500" fill="#E2A93B" />
        <rect x="1250" y="330" width="420" height="40" fill="#3A2A66" /> 
        
        <rect x="1320" y="450" width="100" height="120" fill="#1B2340" />
        <rect x="1280" y="450" width="40" height="120" fill="#C8323A" /> 
        <rect x="1420" y="450" width="40" height="120" fill="#C8323A" /> 
        
        <rect x="1250" y="800" width="150" height="50" fill="#F1E3C2" />
    </g>

    
    <g data-part="light">
        <rect x="1100" y="200" width="15" height="650" fill="#1B2340" />
        <rect x="1050" y="230" width="120" height="10" fill="#1B2340" />
        
        <path d="M0 150 Q 550 300 1100 235" fill="none" stroke="#1B2340" stroke-width="2" opacity="0.7" />
        <path d="M1115 235 Q 1350 280 1600 220" fill="none" stroke="#1B2340" stroke-width="2" opacity="0.7" />
        <path d="M0 180 Q 550 330 1100 245" fill="none" stroke="#1B2340" stroke-width="2" opacity="0.7" />
    </g>

    
    <g stroke="#3A2418" stroke-width="2">
        
        <path d="M320 810 L360 810 L370 760 L310 760 Z" fill="#C2603A" />
        <g data-part="leaf">
            <path d="M340 760 Q 320 720 300 730" fill="none" stroke="#1F6F6B" stroke-width="4" />
            <path d="M340 760 Q 360 720 380 735" fill="none" stroke="#1F6F6B" stroke-width="4" />
        </g>
    </g>

    
    
    <g data-part="leaf">
        <path d="M-50 0 Q 200 50 150 250" fill="none" stroke="#1B2340" stroke-width="15" opacity="0.8" />
        <ellipse cx="150" cy="250" rx="40" ry="20" fill="#1F6F6B" transform="rotate(30 150 250)" />
        <ellipse cx="120" cy="200" rx="35" ry="15" fill="#1F6F6B" transform="rotate(45 120 200)" />
        <ellipse cx="80" cy="140" rx="35" ry="15" fill="#1F6F6B" transform="rotate(20 80 140)" />
        <animateTransform attributeName="transform" type="rotate" values="-1 0 0; 1 0 0; -1 0 0" dur="6s" repeatCount="indefinite" />
    </g>

    
    <g data-part="wheel" transform="translate(1550, 780)">
        <circle r="100" fill="none" stroke="#3A2418" stroke-width="6" />
        <circle r="90" fill="none" stroke="#1B2340" stroke-width="2" opacity="0.5" />
        <line x1="-100" y1="0" x2="100" y2="0" stroke="#3A2418" stroke-width="1" />
        <line x1="0" y1="-100" x2="0" y2="100" stroke="#3A2418" stroke-width="1" />
    </g>

    
    <g data-part="smoke" opacity="0.4">
        <circle cx="450" cy="500" r="15" fill="#F1E3C2">
            <animate attributeName="cy" values="500;400" dur="4s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.4;0" dur="4s" repeatCount="indefinite" />
            <animate attributeName="cx" values="450;470" dur="4s" repeatCount="indefinite" />
        </circle>
        <circle cx="455" cy="520" r="10" fill="#F1E3C2">
            <animate attributeName="cy" values="520;420" dur="4s" begin="1s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.4;0" dur="4s" begin="1s" repeatCount="indefinite" />
            <animate attributeName="cx" values="455;475" dur="4s" begin="1s" repeatCount="indefinite" />
        </circle>
    </g>

    
    <g opacity="0.2">
        <circle cx="800" cy="400" r="2" fill="#F1E3C2">
            <animate attributeName="cy" values="400;380;400" dur="3s" repeatCount="indefinite" />
        </circle>
        <circle cx="600" cy="500" r="1.5" fill="#F1E3C2">
            <animate attributeName="cy" values="500;520;500" dur="4s" repeatCount="indefinite" />
        </circle>
        <circle cx="1000" cy="450" r="2" fill="#F1E3C2">
            <animate attributeName="cy" values="450;430;450" dur="5s" repeatCount="indefinite" />
        </circle>
    </g>
    
    
    

</svg>