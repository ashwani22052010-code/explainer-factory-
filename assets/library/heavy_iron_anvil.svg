<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet">
  <defs>
    
    <linearGradient id="heavy_iron_anvil-ironBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4E58" />
      <stop offset="50%" stop-color="#2C2F36" />
      <stop offset="100%" stop-color="#1B1D22" />
    </linearGradient>
    <linearGradient id="heavy_iron_anvil-ironTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6E7380" />
      <stop offset="30%" stop-color="#4A4E58" />
      <stop offset="100%" stop-color="#24272D" />
    </linearGradient>
    <linearGradient id="heavy_iron_anvil-ironHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#99A0B0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4A4E58" stop-opacity="0" />
    </linearGradient>

    
    <linearGradient id="heavy_iron_anvil-glowMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0" />
      <stop offset="30%" stop-color="#F08A3C" />
      <stop offset="100%" stop-color="#C8323A" />
    </linearGradient>
    <radialGradient id="heavy_iron_anvil-heatGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F08A3C" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#C8323A" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#C8323A" stop-opacity="0" />
    </radialGradient>
  </defs>

  
  <circle cx="500" cy="450" r="180" fill="url(#heavy_iron_anvil-heatGlow)">
    <animate attributeName="r" values="170;190;170" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
  </circle>

  
  <g id="heavy_iron_anvil-anvil" stroke="#3A2418" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    
    
    <path d="M 320 820 L 360 680 L 640 680 L 680 820 Q 700 850 660 850 L 340 850 Q 300 850 320 820 Z" fill="url(#heavy_iron_anvil-ironBase)" />
    
    <path d="M 360 680 L 340 850" fill="none" stroke="#3A2418" stroke-width="6" />
    <path d="M 640 680 L 660 850" fill="none" stroke="#3A2418" stroke-width="6" />
    <path d="M 335 815 L 665 815" fill="none" stroke="#1B1D22" stroke-width="5" />
    <ellipse cx="500" cy="835" rx="140" ry="12" fill="#1B1D22" stroke="#3A2418" />

    
    <path d="M 410 680 L 430 500 L 570 500 L 590 680 Z" fill="url(#heavy_iron_anvil-ironBase)" />
    
    <path d="M 430 500 Q 420 590 410 680" fill="none" stroke="#3A2418" stroke-width="6" />
    <path d="M 570 500 Q 580 590 590 680" fill="none" stroke="#3A2418" stroke-width="6" />
    <path d="M 445 520 L 435 660" fill="none" stroke="#6E7380" stroke-width="4" stroke-linecap="round" />

    
    <path d="M 220 420 L 780 420 L 780 500 L 220 500 Z" fill="url(#heavy_iron_anvil-ironBase)" />
    
    <path d="M 200 420 L 820 420 L 780 500 L 220 500 Z" fill="#24272D" />
    
    
    <circle cx="500" cy="590" r="12" fill="#1B1D22" stroke="#3A2418" stroke-width="4" />
    <circle cx="500" cy="590" r="4" fill="#6E7380" stroke="none" />
    <path d="M 470 550 Q 500 560 530 550" fill="none" stroke="#1B1D22" stroke-width="4" />
    <path d="M 460 630 Q 500 620 540 630" fill="none" stroke="#1B1D22" stroke-width="4" />

    
    <path d="M 230 360 L 760 360 L 800 420 L 200 420 Z" fill="url(#heavy_iron_anvil-ironTop)" />
    
    
    <path d="M 240 375 L 750 375" fill="none" stroke="url(#heavy_iron_anvil-ironHighlight)" stroke-width="8" stroke-linecap="round" />

    
    <path d="M 230 360 Q 120 365 70 390 Q 40 410 70 425 Q 120 440 200 420 Z" fill="url(#heavy_iron_anvil-ironBase)" />
    <path d="M 230 360 Q 120 365 70 390" fill="none" stroke="#3A2418" stroke-width="6" />
    <path d="M 200 420 Q 120 440 70 425" fill="none" stroke="#3A2418" stroke-width="6" />
    
    <path d="M 85 402 Q 110 395 150 385" fill="none" stroke="#99A0B0" stroke-width="4" stroke-linecap="round" />

    
    <path d="M 760 360 L 850 360 L 850 420 L 800 420 Z" fill="url(#heavy_iron_anvil-ironTop)" />
    <path d="M 850 360 L 850 420 L 800 420 Z" fill="#1B1D22" />
    
    
    <polygon points="815,385 835,385 835,405 815,405" fill="#111317" stroke="#3A2418" stroke-width="4" stroke-linejoin="round" />
    
    <circle cx="785" cy="395" r="6" fill="#111317" stroke="#3A2418" stroke-width="3" />

    
    <path d="M 200 420 L 230 420 L 230 450 L 200 450 Z" fill="#1B1D22" stroke="#3A2418" stroke-width="4" />

  </g>

  
  <g data-part="flame" stroke="#3A2418" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    
    
    <ellipse cx="500" cy="372" rx="90" ry="22" fill="#1B1D22" opacity="0.4" />

    
    <path d="M 420 310               L 420 360               Q 420 400 500 400               Q 580 400 580 360               L 580 310               L 535 310               L 535 355               Q 535 370 500 370               Q 465 370 465 355               L 465 310 Z" fill="url(#heavy_iron_anvil-glowMetal)" />

    
    <path d="M 430 315 L 430 355 Q 430 390 500 390 Q 570 390 570 355 L 570 315 L 545 315 L 545 350 Q 545 362 500 362 Q 455 362 455 350 L 455 315 Z" fill="#FFF0A0" opacity="0.7">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="1s" repeatCount="indefinite" />
    </path>

    
    <circle cx="435" cy="330" r="3" fill="#3A2418" />
    <circle cx="435" cy="360" r="3" fill="#3A2418" />
    <circle cx="435" cy="385" r="3" fill="#3A2418" />
    
    <circle cx="565" cy="330" r="3" fill="#3A2418" />
    <circle cx="565" cy="360" r="3" fill="#3A2418" />
    <circle cx="565" cy="385" r="3" fill="#3A2418" />

    
    <path d="M 470 290 Q 460 270 480 250" fill="none" stroke="#F08A3C" stroke-width="4" stroke-linecap="round">
      <animate attributeName="d" values="M 470 290 Q 460 270 480 250; M 470 280 Q 490 260 470 230; M 470 290 Q 460 270 480 250" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite" />
    </path>

    <path d="M 530 285 Q 545 265 525 240" fill="none" stroke="#FFF0A0" stroke-width="4" stroke-linecap="round">
      <animate attributeName="d" values="M 530 285 Q 545 265 525 240; M 530 275 Q 515 250 535 220; M 530 285 Q 545 265 525 240" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite" />
    </path>

    
    <circle cx="500" cy="270" r="5" fill="#FFF0A0" stroke="#3A2418" stroke-width="3">
      <animate attributeName="cy" values="290;220;290" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="1.8s" repeatCount="indefinite" />
    </circle>

    
    <circle cx="450" cy="290" r="4" fill="#F08A3C" stroke="#3A2418" stroke-width="3">
      <animate attributeName="cy" values="300;240;300" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0;0.9" dur="1.4s" repeatCount="indefinite" />
    </circle>

  </g>

</svg>