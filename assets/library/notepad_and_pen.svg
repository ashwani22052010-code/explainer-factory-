<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet">
  
  <defs>
    <linearGradient id="notepad_and_pen-grad_paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F1E3C2" />
      <stop offset="100%" style="stop-color:#E5D4AF" />
    </linearGradient>
    <linearGradient id="notepad_and_pen-grad_pencil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F08A3C" />
      <stop offset="50%" style="stop-color:#E2A93B" />
      <stop offset="100%" style="stop-color:#C2603A" />
    </linearGradient>
  </defs>

  
  <g transform="translate(500, 500) rotate(-5)">
    
    <path d="M-320,-400 L320,-400 Q340,-400 340,-380 L340,420 Q340,440 320,440 L-320,440 Q-340,440 -340,420 L-340,-380 Q-340,-400 -320,-400" fill="#C2603A" stroke="#3A2418" stroke-width="6" />
    
    
    <path d="M-310,-380 L310,-380 L310,410 L-310,410 Z" fill="#1B2340" opacity="0.1" />
    
    
    <path d="M-310,-390 L310,-390 Q330,-390 330,-370 L330,400 Q330,420 310,420 L-310,420 Q-330,420 -330,400 L-330,-370 Q-330,-390 -310,-390" fill="url(#notepad_and_pen-grad_paper)" stroke="#3A2418" stroke-width="6" />

    
    <g stroke="#1F6F6B" stroke-width="2" opacity="0.4">
      <line x1="-280" y1="-300" x2="280" y2="-300" />
      <line x1="-280" y1="-230" x2="280" y2="-230" />
      <line x1="-280" y1="-160" x2="280" y2="-160" />
      <line x1="-280" y1="-90" x2="280" y2="-90" />
      <line x1="-280" y1="-20" x2="280" y2="-20" />
      <line x1="-280" y1="50" x2="280" y2="50" />
      <line x1="-280" y1="120" x2="280" y2="120" />
      <line x1="-280" y1="190" x2="280" y2="190" />
      <line x1="-280" y1="260" x2="280" y2="260" />
      <line x1="-280" y1="330" x2="280" y2="330" />
    </g>

    
    <g fill="none" stroke="#3A2A66" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      
      <rect x="-280" y="-325" width="25" height="25" rx="4" />
      <rect x="-280" y="-255" width="25" height="25" rx="4" />
      <rect x="-280" y="-185" width="25" height="25" rx="4" />
      
      
      <path d="M-240,-315 Q-220,-325 -200,-315 T-160,-315 T-120,-315" />
      <path d="M-240,-245 Q-220,-255 -200,-245 T-160,-245 T-120,-245" />
      <path d="M-240,-175 Q-220,-185 -200,-175 T-160,-175 T-120,-175" />
      
      
      <path d="M-285,-320 L-275,-310 L-260,-335" stroke="#C8323A" stroke-width="7" />
    </g>

    
    <g fill="none" stroke="#3A2418" stroke-width="6" stroke-linecap="round">
      <path d="M-280,-420 Q-280,-450 -260,-450 T-240,-420" />
      <path d="M-200,-420 Q-200,-450 -180,-450 T-160,-420" />
      <path d="M-120,-420 Q-120,-450 -100,-450 T-80,-420" />
      <path d="M-40,-420 Q-40,-450 -20,-450 T0,-420" />
      <path d="M40,-420 Q40,-450 60,-450 T80,-420" />
      <path d="M120,-420 Q120,-450 140,-450 T160,-420" />
      <path d="M200,-420 Q200,-450 220,-450 T240,-420" />
    </g>
    
    
    <path d="M330,350 L330,400 Q330,420 310,420 L260,420 Q310,410 330,350" fill="#FFFFFF" opacity="0.3" />
  </g>

  
  <g data-part="arm_right">
    <g transform="translate(700, 600) rotate(25)">
      
      <ellipse cx="10" cy="20" rx="30" ry="180" fill="#3A2418" opacity="0.2" transform="rotate(-10)" />
      
      
      <rect x="-25" y="-200" width="50" height="300" rx="5" fill="url(#notepad_and_pen-grad_pencil)" stroke="#3A2418" stroke-width="6" />
      
      
      <path d="M-25,100 L0,160 L25,100 Z" fill="#F1E3C2" stroke="#3A2418" stroke-width="6" stroke-linejoin="round" />
      
      
      <path d="M-8,140 L0,160 L8,140 Z" fill="#1B2340" stroke="#3A2418" stroke-width="4" stroke-linejoin="round" />
      
      
      <rect x="-25" y="-220" width="50" height="30" fill="#1F6F6B" stroke="#3A2418" stroke-width="6" />
      <line x1="-25" y1="-205" x2="25" y2="-205" stroke="#3A2418" stroke-width="2" />
      
      
      <path d="M-25,-220 L25,-220 L25,-240 Q25,-260 0,-260 Q-25,-260 -25,-240 Z" fill="#C8323A" stroke="#3A2418" stroke-width="6" />
      
      
      <rect x="-15" y="-190" width="8" height="280" rx="2" fill="#FFFFFF" opacity="0.3" />

      
      <animateTransform attributeName="transform" type="translate" values="0,0; -10,10; 0,0" dur="3s" repeatCount="indefinite" additive="sum" />
      <animateTransform attributeName="transform" type="rotate" values="0; 2; 0" dur="3s" repeatCount="indefinite" additive="sum" />
    </g>
  </g>

  
  <g opacity="0.6">
    <circle cx="200" cy="200" r="4" fill="#E2A93B" />
    <circle cx="850" cy="150" r="6" fill="#C2603A" />
    <circle cx="150" cy="800" r="5" fill="#1F6F6B" />
    <path d="M800,800 L815,815" stroke="#3A2418" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>