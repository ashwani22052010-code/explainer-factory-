<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <defs>
    
    <linearGradient id="set_rustic_bakery_in-wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2A66" />
      <stop offset="60%" stop-color="#F1E3C2" />
      <stop offset="100%" stop-color="#E2A93B" />
    </linearGradient>
    <linearGradient id="set_rustic_bakery_in-floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C2603A" />
      <stop offset="100%" stop-color="#3A2418" />
    </linearGradient>
    <linearGradient id="set_rustic_bakery_in-ovenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C2603A" />
      <stop offset="50%" stop-color="#C8323A" />
      <stop offset="100%" stop-color="#91301F" />
    </linearGradient>
    <linearGradient id="set_rustic_bakery_in-fireGrad" x1="0" y1="1" x2="0" y2="0">
