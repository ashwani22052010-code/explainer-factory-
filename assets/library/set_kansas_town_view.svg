    <linearGradient id="set_kansas_town_view-woodDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C2603A" />
      <stop offset="100%" stop-color="#3A2A66" />
    </linearGradient>
    <linearGradient id="set_kansas_town_view-saloonRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8323A" />
      <stop offset="100%" stop-color="#C2603A" />
