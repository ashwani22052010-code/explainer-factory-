<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <defs>
    
    <linearGradient id="set_kansas_town_view-skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2A66" />
      <stop offset="35%" stop-color="#C2603A" />
      <stop offset="70%" stop-color="#F08A3C" />
      <stop offset="100%" stop-color="#E2A93B" />
    </linearGradient>

    
    <linearGradient id="set_kansas_town_view-prairieGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2A93B" />
      <stop offset="50%" stop-color="#C2603A" />
      <stop offset="100%" stop-color="#1F6F6B" />
    </linearGradient>

    
    <linearGradient id="set_kansas_town_view-roadGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#F1E3C2" />
      <stop offset="40%" stop-color="#E2A93B" />
      <stop offset="100%" stop-color="#C2603A" />
    </linearGradient>

    
    <radialGradient id="set_kansas_town_view-sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F1E3C2" stop-opacity="1" />
      <stop offset="40%" stop-color="#F08A3C" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C2603A" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="set_kansas_town_view-woodLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F1E3C2" />
      <stop offset="100%" stop-color="#E2A93B" />
