  <path d="M-50,450 L120,380 L300,420 L480,350 L650,400 L850,320 L1020,390 L1200,340 L1380,410 L1550,360 L1650,430 L1650,600 L-50,600 Z" fill="url(#set_vast_prairie_tra-farMtn)" />

  
