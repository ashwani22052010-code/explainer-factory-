    <circle cx="1240" cy="180" r="12" fill="#F08A3C" />
    <circle cx="1200" cy="190" r="15" fill="#F08A3C" />
  </g>

  
  <g data-part="light" fill="#F1E3C2" opacity="0.7">
    <circle cx="780" cy="300" r="4">
      <animate attributeName="cy" values="300;250;300" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="820" cy="400" r="6">
