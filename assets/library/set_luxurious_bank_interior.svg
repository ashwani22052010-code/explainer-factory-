<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <defs>
    
    <linearGradient id="set_luxurious_bank_i-bgWallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2A66" />
      <stop offset="60%" stop-color="#1B2340" />
      <stop offset="100%" stop-color="#12182b" />
    </linearGradient>
    <linearGradient id="set_luxurious_bank_i-floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1E3C2" />
      <stop offset="100%" stop-color="#E2A93B" />
    </linearGradient>
    <linearGradient id="set_luxurious_bank_i-pillarGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C2603A" />
      <stop offset="50%" stop-color="#E2A93B" />
      <stop offset="100%" stop-color="#9E4322" />
    </linearGradient>
    <linearGradient id="set_luxurious_bank_i-glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F6F6B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F1E3C2" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="set_luxurious_bank_i-lightBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1E3C2" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F1E3C2" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="set_luxurious_bank_i-goldTrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2A93B" />
      <stop offset="50%" stop-color="#F1E3C2" />
      <stop offset="100%" stop-color="#E2A93B" />
    </linearGradient>
    <radialGradient id="set_luxurious_bank_i-lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F08A3C" stop-opacity="1" />
      <stop offset="100%" stop-color="#F08A3C" stop-opacity="0" />
    </radialGradient>
  </defs>

  
  <rect x="0" y="0" width="1600" height="900" fill="url(#set_luxurious_bank_i-bgWallGrad)" />

  
  <path d="M650,550 L650,220 C650,110 950,110 950,220 L950,550 Z" fill="#1F6F6B" stroke="#3A2418" stroke-width="4" />
  
  <path d="M670,550 L670,230 C670,130 930,130 930,230 L930,550 Z" fill="#F1E3C2" opacity="0.15" />
