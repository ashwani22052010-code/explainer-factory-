    </polygon>

    
    <path d="M -50,-50 L 950,-50 L 950,500 Q 750,450 600,520 Q 450,590 300,500 Q 150,410 -50,480 Z" fill="url(#set_stormy_wheat_fie-stormCore)" />
    
    
    
    <path d="M -20,200 Q 150,120 350,220 T 750,180 T 920,250 L 920,-50 L -20,-50 Z" fill="#1B2340" opacity="0.95" />
    <circle cx="200" cy="180" r="160" fill="#0D1120" opacity="0.8" />
    <circle cx="380" cy="220" r="180" fill="#0D1120" opacity="0.85" />
    <circle cx="620" cy="190" r="200" fill="#0D1120" opacity="0.9" />
    <circle cx="850" cy="230" r="170" fill="#0D1120" opacity="0.85" />

    
    <path d="M -50,320 Q 100,200 280,300 Q 460,400 650,280 Q 800,180 950,290 L 950,-50 L -50,-50 Z" fill="#0D1120" />
    
    
    <path d="M 50,330 Q 180,260 300,320" stroke="#1F6F6B" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M 340,340 Q 480,410 600,320" stroke="#1F6F6B" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.6" />
    <path d="M 630,300 Q 750,220 880,300" stroke="#3A2A66" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.8" />

    
    <g data-part="smoke">
