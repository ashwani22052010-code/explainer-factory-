        <animateTransform attributeName="transform" type="translate" values="-150,10; 120,-10; -150,10" dur="7s" repeatCount="indefinite" />
      </path>
    </g>

    
    <g stroke="#3A2418" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      
      <path d="M 620,1180 Q 720,1210 820,1190" fill="none" stroke="#1B2340" stroke-width="2" />
      <path d="M 620,1210 Q 720,1240 820,1220" fill="none" stroke="#1B2340" stroke-width="2" />
      
      <polygon points="630,1250 642,1150 655,1152 645,1252" fill="#C2603A" />
      
      <polygon points="800,1260 812,1140 827,1143 815,1263" fill="#C2603A" />
    </g>

    
    <g transform="translate(180, 1220) rotate(-15)" stroke="#3A2418" stroke-width="3" stroke-linejoin="round">
