        <animateTransform attributeName="transform" type="rotate" values="0; 9; 0" dur="3.3s" repeatCount="indefinite" additive="sum" />
      </g>
      
      <path d="M 920,1600 Q 860,1380 760,1340 C 810,1410 880,1510 910,1600 Z" fill="#E2A93B" stroke="#3A2418" stroke-width="3" />
      <path d="M 850,1600 Q 770,1400 660,1360 C 730,1430 800,1520 830,1600 Z" fill="#C2603A" stroke="#3A2418" stroke-width="3" />
    </g>

    
    <g data-part="leaf">
      <path d="M 300,1350 C 290,1340 270,1345 275,1355 C 285,1360 305,1355 300,1350 Z" fill="#F1E3C2" stroke="#3A2418" stroke-width="1.5">
        <animateTransform attributeName="transform" type="translate" values="0,0; 400,-150; 800,-300" dur="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;0.9;0.8;0" dur="4s" repeatCount="indefinite" />
      </path>
      <path d="M 100,1200 C 90,1190 70,1195 75,1205 C 85,1210 105,1205 100,1200 Z" fill="#E2A93B" stroke="#3A2418" stroke-width="1.5">
        <animateTransform attributeName="transform" type="translate" values="0,0; 500,-200; 900,-350" dur="3.2s" begin="1s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;1;0.5;0" dur="3.2s" begin="1s" repeatCount="indefinite" />
      </path>
      <path d="M 200,1500 C 190,1490 170,1495 175,1505 C 185,1510 205,1505 200,1500 Z" fill="#F08A3C" stroke="#3A2418" stroke-width="1.5">
        <animateTransform attributeName="transform" type="translate" values="0,0; 450,-180; 750,-300" dur="5s" begin="0.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;0.8;0.3;0" dur="5s" begin="0.5s" repeatCount="indefinite" />
      </path>
    </g>

    
    <rect x="0" y="0" width="900" height="1600" fill="#1B2340" opacity="0.08" style="mix-blend-mode:multiply" />
