      <use href="#set_stormy_wheat_fie-wheatSingle" transform="scale(1.1) translate(10, 5) rotate(5)" />
      <use href="#set_stormy_wheat_fie-wheatSingle" transform="scale(0.8) translate(-8, 10) rotate(-22)" />
      <use href="#set_stormy_wheat_fie-wheatSingle" transform="scale(1.05) translate(18, 2) rotate(15)" />
