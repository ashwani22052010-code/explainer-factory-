      <path d="M-20,0 Q -40,-30 -60,-20 M70,0 Q 90,-40 110,-25" stroke="#C2603A" stroke-width="3" />
    </g>
    
    <g transform="translate(720, 1040)" stroke="#3A2418" stroke-width="2">
