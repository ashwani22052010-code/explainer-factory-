<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid meet">
  <defs>
    
    <linearGradient id="set_stormy_wheat_fie-skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2340" />
      <stop offset="40%" stop-color="#3A2A66" />
      <stop offset="75%" stop-color="#1F6F6B" />
      <stop offset="100%" stop-color="#E2A93B" />
    </linearGradient>
    
    <radialGradient id="set_stormy_wheat_fie-stormCore" cx="50%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#0D1120" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#1B2340" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#3A2A66" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3A2A66" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="set_stormy_wheat_fie-lightningGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1E3C2" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#E2A93B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3A2A66" stop-opacity="0" />
    </linearGradient>

    
    <linearGradient id="set_stormy_wheat_fie-farHillsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F6F6B" />
      <stop offset="100%" stop-color="#3A2A66" />
    </linearGradient>

    <linearGradient id="set_stormy_wheat_fie-midFieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C2603A" />
      <stop offset="30%" stop-color="#E2A93B" />
      <stop offset="100%" stop-color="#1F6F6B" />
    </linearGradient>

    <linearGradient id="set_stormy_wheat_fie-foreFieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F08A3C" />
      <stop offset="40%" stop-color="#E2A93B" />
      <stop offset="100%" stop-color="#3A2418" />
    </linearGradient>

    
    <linearGradient id="set_stormy_wheat_fie-windGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1E3C2" stop-opacity="0" />
      <stop offset="50%" stop-color="#F1E3C2" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F1E3C2" stop-opacity="0" />
    </linearGradient>

    
    <radialGradient id="set_stormy_wheat_fie-charZoneShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3A2418" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3A2418" stop-opacity="0" />
    </radialGradient>

    
    <g id="set_stormy_wheat_fie-wheatSingle">
