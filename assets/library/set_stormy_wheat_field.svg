      <path d="M -20,1600 Q 40,1400 120,1350 C 80,1420 20,1520 -10,1600 Z" fill="#E2A93B" stroke="#3A2418" stroke-width="3" />
      <path d="M 30,1600 Q 110,1380 200,1320 C 150,1420 70,1510 40,1600 Z" fill="#F08A3C" stroke="#3A2418" stroke-width="3" />
    </g>

    
    <g data-part="leaf">
