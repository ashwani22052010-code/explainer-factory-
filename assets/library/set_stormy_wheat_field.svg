      <ellipse cx="0" cy="0" rx="10" ry="4" fill="#3A2418" />
      <line x1="-45" y1="0" x2="45" y2="0" />
      <line x1="-30" y1="-12" x2="30" y2="12" />
      <line x1="-30" y1="12" x2="30" y2="-12" />
      
      <path d="M -55,5 Q 0,25 55,10 L 50,30 L -50,30 Z" fill="#E2A93B" stroke="none" />
    </g>

    
    
