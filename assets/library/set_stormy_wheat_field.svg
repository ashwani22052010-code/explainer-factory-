      <path d="M 0,0 Q -5,-40 -12,-80" stroke="#E2A93B" stroke-width="1.5" fill="none" />
      
      <path d="M -12,-80 C -18,-75 -15,-65 -10,-65 C -5,-65 -8,-75 -12,-80 Z" fill="#F08A3C" stroke="#3A2418" stroke-width="1" />
      <path d="M -10,-65 C -16,-60 -13,-50 -8,-50 C -3,-50 -6,-60 -10,-65 Z" fill="#E2A93B" stroke="#3A2418" stroke-width="1" />
      <path d="M -8,-50 C -14,-45 -11,-35 -6,-35 C -1,-35 -4,-45 -8,-50 Z" fill="#F1E3C2" stroke="#3A2418" stroke-width="1" />
    </g>

    <g id="set_stormy_wheat_fie-wheatCluster">
