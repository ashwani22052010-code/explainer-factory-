  <g stroke="#3A2418" stroke-width="4">
    
    <polygon points="650,620 1150,620 1250,780 550,780" fill="url(#set_corporate_office-deskGrad)" />
    
    <polygon points="620,580 1180,580 1150,620 650,620" fill="#E2A93B" />
    
    <polygon points="1180,580 1250,780 1250,740 1150,620" fill="#C2603A" />
  </g>

  
  <g stroke="#3A2418" stroke-width="2">
    
    <polygon points="850,595 930,585 950,610 870,620" fill="#F1E3C2" />
    <polygon points="850,595 930,585 930,560 850,570" fill="#1B2340" />
    
    <path d="M 720,600 L 730,520 L 710,500" fill="none" stroke="#E2A93B" stroke-width="6" stroke-linecap="round" />
    <path d="M 695,490 L 725,490 L 735,515 L 685,515 Z" fill="#C8323A" />
    
    <circle cx="1080" cy="540" r="25" fill="#1F6F6B" />
    <path d="M 1055,540 Q 1080,520 1105,540" fill="none" stroke="#E2A93B" stroke-width="2" />
    <path d="M 1080,515 Q 1060,540 1080,565" fill="none" stroke="#E2A93B" stroke-width="2" />
    <rect x="1075" y="565" width="10" height="15" fill="#3A2418" />
  </g>

  
  <g stroke="#3A2418" stroke-width="4">
    
    <rect x="830" y="400" width="140" height="200" rx="20" fill="#3A2418" />
    <rect x="850" y="420" width="100" height="160" rx="10" fill="#C2603A" />
    
    <rect x="820" y="580" width="160" height="40" rx="10" fill="#1B2340" />
  </g>

  
  <g stroke="#3A2418" stroke-width="3">
    
    <rect x="520" y="650" width="70" height="80" rx="10" fill="#C8323A" />
    <rect x="510" y="600" width="90" height="60" rx="10" fill="#C8323A" />
    <line x1="530" y1="730" x2="520" y2="780" stroke-width="4" />
    <line x1="580" y1="730" x2="590" y2="780" stroke-width="4" />

    
    <rect x="1150" y="660" width="70" height="80" rx="10" fill="#C8323A" />
    <rect x="1140" y="610" width="90" height="60" rx="10" fill="#C8323A" />
    <line x1="1160" y1="740" x2="1150" y2="790" stroke-width="4" />
    <line x1="1210" y1="740" x2="1220" y2="790" stroke-width="4" />
  </g>

  
  <g stroke="#3A2418" stroke-width="3">
    
    <polygon points="1420,650 1480,650 1500,740 1400,740" fill="#F08A3C" />
    
    <path d="M 1450,650 Q 1420,550 1370,500" fill="none" stroke="#1F6F6B" stroke-width="6" />
    <path d="M 1450,650 Q 1470,530 1520,470" fill="none" stroke="#1F6F6B" stroke-width="6" />
    <path d="M 1450,650 Q 1450,500 1460,420" fill="none" stroke="#1F6F6B" stroke-width="6" />
    
    <ellipse cx="1370" cy="490" rx="25" ry="15" fill="#1F6F6B" transform="rotate(-30 1370 490)" />
    <ellipse cx="1520" cy="460" rx="25" ry="15" fill="#1F6F6B" transform="rotate(30 1520 460)" />
    <ellipse cx="1460" cy="410" rx="20" ry="30" fill="#1F6F6B" />
  </g>

  
  
  <polygon points="450,100 1150,100 1300,900 300,900" fill="url(#set_corporate_office-lightBeam)" style="mix-blend-mode:overlay" />

  
  <g stroke="#3A2418" stroke-width="3">
    <line x1="800" y1="0" x2="800" y2="80" stroke-width="6" />
    <rect x="700" y="80" width="200" height="20" rx="5" fill="#E2A93B" />
    
    <polygon points="720,100 880,100 1000,300 600,300" fill="#F1E3C2" opacity="0.3" />
  </g>

  
  <g data-part="light">
    <circle cx="700" cy="400" r="4" fill="#F1E3C2" opacity="0.6">
      <animate attributeName="cy" values="400;380;400" dur="4s" repeatCount="indefinite" />
      <animate attributeName="cx" values="700;710;700" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="850" cy="500" r="6" fill="#F1E3C2" opacity="0.4">
      <animate attributeName="cy" values="500;470;500" dur="5s" repeatCount="indefinite" />
      <animate attributeName="cx" values="850;840;850" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="450" r="3" fill="#F1E3C2" opacity="0.5">
      <animate attributeName="cy" values="450;430;450" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>

  
  <path d="M 0,0 L 100,0 L 0,100 Z" fill="#1B2340" opacity="0.3" />
  <path d="M 1600,0 L 1500,0 L 1600,100 Z" fill="#1B2340" opacity="0.3" />

</svg>