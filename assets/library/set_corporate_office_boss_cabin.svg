    <rect x="60" y="410" width="130" height="15" fill="#C2603A" />
    <rect x="60" y="490" width="130" height="15" fill="#C2603A" />
    
    <rect x="70" y="215" width="20" height="35" fill="#C8323A" />
    <rect x="95" y="210" width="15" height="40" fill="#E2A93B" />
    <rect x="115" y="220" width="30" height="30" fill="#1F6F6B" />
    <rect x="70" y="290" width="25" height="40" fill="#3A2A66" />
    <rect x="100" y="295" width="20" height="35" fill="#F08A3C" />
