<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <defs>
    
    <linearGradient id="set_corporate_office-skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2A66" />
      <stop offset="50%" stop-color="#C2603A" />
      <stop offset="100%" stop-color="#E2A93B" />
    </linearGradient>
    <linearGradient id="set_corporate_office-wallGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B2340" />
      <stop offset="100%" stop-color="#1F6F6B" />
    </linearGradient>
    <linearGradient id="set_corporate_office-glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1E3C2" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1F6F6B" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="set_corporate_office-deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C2603A" />
      <stop offset="100%" stop-color="#3A2418" />
    </linearGradient>
    <linearGradient id="set_corporate_office-floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2418" />
      <stop offset="100%" stop-color="#1B2340" />
    </linearGradient>
    <linearGradient id="set_corporate_office-lightBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1E3C2" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F1E3C2" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  
  <rect x="0" y="0" width="1600" height="900" fill="url(#set_corporate_office-skyGrad)" />
  
  
  <g fill="#1B2340" opacity="0.6">
