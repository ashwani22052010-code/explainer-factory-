  </g>
  <g fill="#3A2A66" opacity="0.8">
    <rect x="450" y="320" width="90" height="280" />
    <rect x="560" y="260" width="110" height="340" />
    <rect x="690" y="300" width="80" height="300" />
    <rect x="790" y="360" width="60" height="240" />
    <polygon points="560,260 615,200 670,260" />
  </g>

  
  <rect x="450" y="100" width="700" height="500" fill="url(#set_corporate_office-glassGrad)" stroke="#1B2340" stroke-width="8" />
  
  <line x1="450" y1="266" x2="1150" y2="266" stroke="#1B2340" stroke-width="6" />
  <line x1="450" y1="433" x2="1150" y2="433" stroke="#1B2340" stroke-width="6" />
  <line x1="683" y1="100" x2="683" y2="600" stroke="#1B2340" stroke-width="6" />
  <line x1="916" y1="100" x2="916" y2="600" stroke="#1B2340" stroke-width="6" />

  
  
  <polygon points="0,0 450,100 450,600 0,750" fill="url(#set_corporate_office-wallGrad)" stroke="#3A2418" stroke-width="4" />
  
  <polygon points="1600,0 1150,100 1150,600 1600,750" fill="#1F6F6B" stroke="#3A2418" stroke-width="4" />
  
  <polygon points="0,750 1600,750 1600,900 0,900" fill="url(#set_corporate_office-floorGrad)" stroke="#3A2418" stroke-width="4" />
  
  
  <line x1="800" y1="750" x2="0" y2="900" stroke="#1B2340" stroke-width="2" />
