  <line x1="800" y1="750" x2="550" y2="900" stroke="#1B2340" stroke-width="2" />
  <line x1="800" y1="750" x2="800" y2="900" stroke="#1B2340" stroke-width="2" />
  <line x1="800" y1="750" x2="1050" y2="900" stroke="#1B2340" stroke-width="2" />
  <line x1="800" y1="750" x2="1350" y2="900" stroke="#1B2340" stroke-width="2" />
