<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet">
  <defs>
    
    <linearGradient id="tea_cup-cupBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2603A" />
      <stop offset="35%" stop-color="#C2603A" />
      <stop offset="70%" stop-color="#E2A93B" />
      <stop offset="100%" stop-color="#A54D2B" />
    </linearGradient>
    <linearGradient id="tea_cup-cupInside" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2340" />
      <stop offset="50%" stop-color="#3A2A66" />
      <stop offset="100%" stop-color="#1F6F6B" />
    </linearGradient>
    <linearGradient id="tea_cup-liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C8323A" />
      <stop offset="100%" stop-color="#A02026" />
    </linearGradient>
    <linearGradient id="tea_cup-handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2A93B" />
      <stop offset="100%" stop-color="#C2603A" />
    </linearGradient>
    <linearGradient id="tea_cup-steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F1E3C2" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F1E3C2" stop-opacity="0" />
    </linearGradient>
  </defs>

  
  <g data-part="smoke">
    
