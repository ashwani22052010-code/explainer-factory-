      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite" />
    </path>

    
    <path d="M500,360 C530,300 470,240 510,180 C530,150 500,120 520,70" fill="none" stroke="#3A2418" stroke-width="6" stroke-linecap="round" />
