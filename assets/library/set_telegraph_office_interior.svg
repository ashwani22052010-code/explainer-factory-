  <rect x="0" y="0" width="1600" height="25" fill="#3A2418" stroke="#3A2418" stroke-width="2" />
  <rect x="0" y="25" width="1600" height="10" fill="#E2A93B" />

  
  <g data-part="smoke">
    <path d="M 275 425 Q 285 415 295 425" fill="none" stroke="#F1E3C2" stroke-width="3" stroke-linecap="round">
      <animate attributeName="d" values="M 275 425 Q 285 415 295 425;M 275 425 Q 285 430 295 425;M 275 425 Q 285 415 295 425" dur="0.2s" repeatCount="indefinite" />
