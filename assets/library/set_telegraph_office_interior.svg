  <path d="M 1520 0 L 1600 0 L 1600 900 L 1520 900 Z" fill="#1B2340" stroke="#3A2418" stroke-width="4" />
  <path d="M 1500 0 L 1520 0 L 1520 900 L 1500 900 Z" fill="#3A2418" stroke="#3A2418" stroke-width="3" />

  
  <g transform="translate(100, 720)">
