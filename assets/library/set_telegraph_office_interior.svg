      <stop offset="0%" stop-color="#3A2A66" />
      <stop offset="60%" stop-color="#E2A93B" />
      <stop offset="100%" stop-color="#C2603A" />
    </linearGradient>
    <linearGradient id="set_telegraph_office-floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C2603A" />
      <stop offset="30%" stop-color="#E2A93B" />
      <stop offset="100%" stop-color="#3A2418" />
    </linearGradient>
