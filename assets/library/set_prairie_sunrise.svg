    <circle cx="20" cy="55" r="30" fill="none" stroke-width="5" />
    <circle cx="20" cy="55" r="6" fill="#3A2418" />
    <line x1="20" y1="25" x2="20" y2="85" />
    <line x1="-10" y1="55" x2="50" y2="55" />
    
    <circle cx="100" cy="62" r="25" fill="none" stroke-width="4" />
    <circle cx="100" cy="62" r="5" fill="#3A2418" />
    <line x1="100" y1="37" x2="100" y2="87" />
    <line x1="75" y1="62" x2="125" y2="62" />
    
    <path d="M 10,-10 Q 60,-30 110,-10" fill="none" stroke-width="3" stroke-dasharray="8,8" />
