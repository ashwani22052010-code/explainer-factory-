  <g stroke="#3A2418" stroke-width="2" fill="#E2A93B">
    
    <path d="M 350,950 Q 370,860 410,820 Q 390,890 380,950 Z" />
    <path d="M 400,950 Q 430,880 470,850 Q 440,910 430,950 Z" fill="#C2603A" />
    <path d="M 460,950 Q 480,890 520,860 Q 490,920 480,950 Z" />

    
    <path d="M 1250,950 Q 1230,870 1190,840 Q 1210,910 1220,950 Z" />
    <path d="M 1200,950 Q 1170,890 1130,860 Q 1160,920 1170,950 Z" fill="#C2603A" />
    <path d="M 1140,950 Q 1120,880 1080,850 Q 1110,920 1120,950 Z" fill="#F1E3C2" />
