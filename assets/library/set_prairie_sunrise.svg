  <g data-part="leaf" fill="#E2A93B" stroke="#3A2418" stroke-width="2">
    <path d="M 850,550 Q 870,530 900,540 Q 870,560 850,550 Z">
      <animateTransform attributeName="transform" type="translate" values="0,0; -100,50; -200,120; -300,200" dur="12s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="rotate" values="0; 45; 90; 180" dur="12s" repeatCount="indefinite" additive="sum" />
