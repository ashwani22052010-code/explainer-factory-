<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <defs>
    
    <linearGradient id="set_prairie_sunrise-skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A2A66" />
      <stop offset="35%" stop-color="#C2603A" />
      <stop offset="70%" stop-color="#F08A3C" />
      <stop offset="100%" stop-color="#F1E3C2" />
    </linearGradient>
    
    <linearGradient id="set_prairie_sunrise-sunGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1E3C2" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F08A3C" stop-opacity="0" />
    </linearGradient>

    
    <linearGradient id="set_prairie_sunrise-farHillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F6F6B" />
      <stop offset="100%" stop-color="#3A2A66" />
    </linearGradient>

    <linearGradient id="set_prairie_sunrise-midHillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2A93B" />
      <stop offset="100%" stop-color="#1F6F6B" />
    </linearGradient>

    <linearGradient id="set_prairie_sunrise-nearGroundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1E3C2" />
      <stop offset="30%" stop-color="#E2A93B" />
      <stop offset="100%" stop-color="#C2603A" />
    </linearGradient>

    <linearGradient id="set_prairie_sunrise-sunray" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1E3C2" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F08A3C" stop-opacity="0" />
    </linearGradient>
  </defs>

  
  <rect x="0" y="0" width="1600" height="900" fill="url(#set_prairie_sunrise-skyGrad)" />

  
  <circle cx="800" cy="450" r="140" fill="#F1E3C2" opacity="0.9" />
  <circle cx="800" cy="450" r="220" fill="url(#set_prairie_sunrise-sunGlow)" />

  
  <g data-part="light" opacity="0.3">
    <polygon points="800,450 300,900 450,900" fill="url(#set_prairie_sunrise-sunray)" />
    <polygon points="800,450 600,900 750,900" fill="url(#set_prairie_sunrise-sunray)" />
    <polygon points="800,450 950,900 1100,900" fill="url(#set_prairie_sunrise-sunray)" />
    <polygon points="800,450 1250,900 1400,900" fill="url(#set_prairie_sunrise-sunray)" />
  </g>

  
  
  <path d="M0 500 Q 250 380, 500 460 T 1000 440 T 1600 480 L 1600 900 L 0 900 Z" fill="url(#set_prairie_sunrise-farHillGrad)" opacity="0.8" />
  
  
  <path d="M0 550 Q 350 450, 700 520 T 1600 500 L 1600 900 L 0 900 Z" fill="url(#set_prairie_sunrise-midHillGrad)" stroke="#3A2418" stroke-width="3" />

  
  <g stroke="#3A2418" stroke-width="3" fill="#1B2340">
