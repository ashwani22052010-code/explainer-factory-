  <path d="M 500,680 L 530,620 L 580,640 L 610,690 Z" fill="#3A2A66" stroke="#3A2418" stroke-width="3" />
  <path d="M 480,670 L 500,630 L 535,675 Z" fill="#1F6F6B" stroke="#3A2418" stroke-width="3" />

  
  
  <path d="M-50 950 L-50 750 Q 200 680, 500 780 T 1200 750 T 1650 820 L 1650 950 Z" fill="#C2603A" stroke="#3A2418" stroke-width="4" />

  
  <path d="M-50 950 L 1650 950 L 1650 850 Q 1200 830, 800 890 T 0 840 Z" fill="#1B2340" />

  
  <g stroke="#3A2418" stroke-width="3" fill="#E2A93B">
    
