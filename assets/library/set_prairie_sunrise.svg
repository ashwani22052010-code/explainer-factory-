    <path d="M 1530,950 Q 1480,750 1440,680 Q 1470,820 1410,950 Z" fill="#C2603A" />
    <path d="M 1450,950 Q 1400,780 1360,710 Q 1390,850 1340,950 Z" fill="#F1E3C2" />
    <path d="M 1380,950 Q 1340,810 1300,740 Q 1320,870 1270,950 Z" />
