<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet">
  <defs>
    
    <linearGradient id="lightning_flash-cloudDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A2A66" />
      <stop offset="100%" stop-color="#1B2340" />
    </linearGradient>
    <linearGradient id="lightning_flash-cloudBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1E3C2" />
      <stop offset="100%" stop-color="#E2A93B" />
    </linearGradient>
    <linearGradient id="lightning_flash-cloudHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1E3C2" />
    </linearGradient>

    
    <linearGradient id="lightning_flash-boltCore" x1="0%" y1="0%" x2="50%" y2="100%">
