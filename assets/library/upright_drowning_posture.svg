    <circle cx="465" cy="245" r="5">
      <animate attributeName="cy" from="245" to="130" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0" dur="2.5s" repeatCount="indefinite" />
