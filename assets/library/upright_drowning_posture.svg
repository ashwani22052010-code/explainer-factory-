    <circle cx="495" cy="260" r="4">
      <animate attributeName="cy" from="260" to="140" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0" dur="1.8s" repeatCount="indefinite" />
    </circle>
