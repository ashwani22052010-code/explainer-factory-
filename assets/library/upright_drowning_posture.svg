  <path d="M200,150 Q400,100 600,150 L600,170 Q400,120 200,170 Z" fill="#F1E3C2" opacity="0.2" />
  
  
  <circle cx="280" cy="400" r="3" fill="#E2A93B" opacity="0.4" />
  <circle cx="550" cy="650" r="4" fill="#E2A93B" opacity="0.3" />
  <circle cx="320" cy="800" r="3" fill="#E2A93B" opacity="0.4" />
