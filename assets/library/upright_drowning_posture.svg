    <g>
      
      <path d="M-10,-240 C-15,-270 10,-310 40,-310 C70,-310 85,-280 80,-260 C75,-240 50,-235 30,-235 C15,-235 5,-230 0,-215 Z" fill="#F1E3C2" stroke="#3A2418" stroke-width="6" stroke-linejoin="round" />
      
      <path d="M60,-285 L65,-285" fill="none" stroke="#3A2418" stroke-width="4" stroke-linecap="round" /> 
      <path d="M78,-265 Q70,-260 65,-268" fill="none" stroke="#3A2418" stroke-width="3" stroke-linecap="round" /> 
      
      
      <path d="M-15,-215 C-25,-150 -25,-50 -20,110 L25,110 C20,-50 20,-150 15,-220 Z" fill="#F1E3C2" stroke="#3A2418" stroke-width="6" stroke-linejoin="round" />
      
      
      <path d="M5,-215 C0,-150 0,-50 5,110 L25,110 C20,-50 20,-150 15,-220 Z" fill="#C2603A" opacity="0.2" />

      
      <path d="M-22,-20 L27,-20 L25,115 L-21,115 Z" fill="#C8323A" stroke="#3A2418" stroke-width="6" stroke-linejoin="round" />
      <rect x="5" y="-20" width="15" height="135" fill="#F08A3C" opacity="0.3" />
      
      
      <path d="M-5,-130 C-15,-80 -25,20 -15,80 C-12,95 5,95 8,80 C15,20 15,-80 5,-130 Z" fill="#F1E3C2" stroke="#3A2418" stroke-width="6" stroke-linejoin="round" />
      
      <path d="M3,-130 C8,-80 8,20 3,80 C5,90 7,90 8,80 C15,20 15,-80 5,-130 Z" fill="#C2603A" opacity="0.3" />
    </g>

    
    <path d="M-15,100 C-25,150 -30,250 -25,360 C-25,385 -35,395 -45,395 L-20,410 L5,410 C5,395 -5,385 -5,360 C0,250 5,150 5,100 Z" fill="#F1E3C2" stroke="#3A2418" stroke-width="6" stroke-linejoin="round" />
    
    <path d="M-5,100 C0,150 5,250 0,360 C0,385 -5,395 -10,395 L-5,405 L5,410 C5,395 -5,385 -5,360 C0,250 5,150 5,100 Z" fill="#C2603A" opacity="0.3" />
