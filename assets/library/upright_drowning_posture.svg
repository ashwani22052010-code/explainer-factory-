  <g fill="#F1E3C2" opacity="0.6">
    <circle cx="480" cy="220" r="8">
      <animate attributeName="cy" from="220" to="120" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0" dur="2s" repeatCount="indefinite" />
