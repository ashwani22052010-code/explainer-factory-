<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="upright_drowning_pos-grad_water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F6F6B" />
      <stop offset="100%" stop-color="#1B2340" />
    </linearGradient>
    <linearGradient id="upright_drowning_pos-grad_skin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1E3C2" />
      <stop offset="100%" stop-color="#C2603A" />
    </linearGradient>
    <clipPath id="upright_drowning_pos-clip_water">
      <path d="M200,150 Q400,100 600,150 L600,900 Q400,950 200,900 Z" />
    </clipPath>
  </defs>

  
  <g>
    
    <path d="M200,150 Q400,100 600,150 L600,900 Q400,950 200,900 Z" fill="url(#upright_drowning_pos-grad_water)" stroke="#3A2418" stroke-width="8" stroke-linejoin="round" />
    
    
    <path d="M210,165 Q400,125 590,165" fill="none" stroke="#F1E3C2" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  </g>

  
  <g transform="translate(400, 500)">
    
    <animateTransform attributeName="transform" type="translate" values="400,500; 400,515; 400,500" dur="4s" repeatCount="indefinite" />
    
    
    <path d="M-15,-310 C-40,-310 -50,-260 -40,-240 C-30,-230 -10,-230 0,-240 L10,-280 Z" fill="#3A2A66" stroke="#3A2418" stroke-width="6" stroke-linejoin="round" />
    
    
