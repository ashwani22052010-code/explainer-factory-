    <polygon points="250,220 220,320 270,320 240,420 320,300 270,300 300,220" fill="#E2A93B" stroke="#3A2418" stroke-width="4" stroke-linejoin="round" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.1;0.9;0.4" dur="1.5s" repeatCount="indefinite" />
    </polygon>
