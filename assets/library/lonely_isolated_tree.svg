  <path d="M 180 750 Q 500 600 820 750 Q 900 820 850 900 Q 500 950 150 900 Q 100 820 180 750 Z" fill="url(#lonely_isolated_tree-hillGrad)" stroke="#3A2418" stroke-width="6" stroke-linejoin="round" />
  
