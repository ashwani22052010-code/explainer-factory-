<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet">
  <defs>
    
    <linearGradient id="lonely_isolated_tree-skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2340" />
      <stop offset="60%" stop-color="#3A2A66" />
      <stop offset="100%" stop-color="#C2603A" />
    </linearGradient>

    <linearGradient id="lonely_isolated_tree-cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2340" />
      <stop offset="50%" stop-color="#3A2A66" />
      <stop offset="100%" stop-color="#1F6F6B" />
    </linearGradient>

    <linearGradient id="lonely_isolated_tree-hillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F6F6B" />
      <stop offset="40%" stop-color="#1B2340" />
      <stop offset="100%" stop-color="#3A2A66" />
    </linearGradient>

    <linearGradient id="lonely_isolated_tree-trunkGrad" x1="0" y1="0" x2="1" y2="0">
