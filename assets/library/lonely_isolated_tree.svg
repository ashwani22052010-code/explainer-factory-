      <path d="M 660 250 Q 720 230 740 260 Q 680 280 660 250 Z" fill="#E2A93B" stroke="#3A2418" stroke-width="4" />
      <path d="M 280 200 Q 240 160 270 140 Q 300 180 280 200 Z" fill="#E2A93B" stroke="#3A2418" stroke-width="4" />
    </g>
  </g>

  
  <g data-part="wing_left">
    
    <path d="M 500 120 C 698 120 860 282 860 480 C 860 678 698 840 500 840 C 302 840 140 678 140 480 C 140 282 302 120 500 120 Z               M 500 220 C 356 220 240 336 240 480 C 240 624 356 740 500 740 C 644 740 760 624 760 480 C 760 336 644 220 500 220 Z" fill="url(#lonely_isolated_tree-redGlow)" stroke="#3A2418" stroke-width="8" fill-rule="evenodd" stroke-linejoin="round" />

    
