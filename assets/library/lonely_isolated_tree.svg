    <path d="M 370 340 Q 330 250 280 200 L 300 180 Q 360 240 390 310 Z" fill="url(#lonely_isolated_tree-trunkGrad)" stroke="#3A2418" stroke-width="6" stroke-linejoin="round" />

    
