    <path d="M 120 300 Q 150 180 280 200 Q 380 120 520 180 Q 650 120 780 220 Q 900 200 880 350 Q 950 450 850 520 Q 900 600 780 650 Q 500 700 300 620 Q 100 600 120 450 Q 50 380 120 300 Z" fill="url(#lonely_isolated_tree-cloudGrad)" stroke="#3A2418" stroke-width="6" stroke-linejoin="round" />
    
    
    <path d="M 200 280 Q 280 220 380 280 Q 480 200 600 260 Q 720 220 800 320" fill="none" stroke="#F1E3C2" stroke-width="4" opacity="0.3" stroke-linecap="round" />
    <path d="M 180 380 Q 300 320 450 400 Q 600 350 750 420" fill="none" stroke="#3A2418" stroke-width="5" opacity="0.6" stroke-linecap="round" />
  </g>

  
  <g data-part="light">
