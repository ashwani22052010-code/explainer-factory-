    </linearGradient>

    <linearGradient id="lonely_isolated_tree-canopyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2A93B" />
      <stop offset="50%" stop-color="#1F6F6B" />
      <stop offset="100%" stop-color="#1B2340" />
    </linearGradient>

    <linearGradient id="lonely_isolated_tree-redGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F08A3C" />
      <stop offset="50%" stop-color="#C8323A" />
      <stop offset="100%" stop-color="#3A2418" />
    </linearGradient>
  </defs>

  
  <g data-part="smoke">
