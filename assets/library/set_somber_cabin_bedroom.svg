      <rect x="13" y="5" width="14" height="6" fill="#F1E3C2" stroke="#3A2418" stroke-width="3" />
      
      <path d="M12 45 C 15 42 25 42 28 45 C 28 60 22 65 20 65 C 18 65 12 60 12 45 Z" fill="#F08A3C" opacity="0.6" />
      
      <path d="M14 25 Q 16 40 14 55" fill="none" stroke="#F1E3C2" stroke-width="2" opacity="0.7" />
    </g>
    
    <ellipse cx="910" cy="475" rx="18" ry="8" fill="#F1E3C2" stroke="#3A2418" stroke-width="3" />
  </g>

  
  
  <g stroke="#3A2418" stroke-width="3" fill="#C2603A">
    <line x1="600" y1="0" x2="600" y2="50" />
    <path d="M580 50 Q 600 80 620 50 Z" />
    <line x1="680" y1="0" x2="670" y2="40" />
    <path d="M655 40 Q 670 70 685 40 Z" fill="#1F6F6B" />
  </g>

  
  <g data-part="light" fill="#F1E3C2" opacity="0.5">
    <circle cx="350" cy="300" r="4">
      <animate attributeName="cy" values="300;280;300" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="420" cy="250" r="3">
      <animate attributeName="cy" values="250;230;250" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="280" cy="400" r="5">
      <animate attributeName="cy" values="400;370;400" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="500" cy="350" r="3">
      <animate attributeName="cy" values="350;330;350" dur="4.5s" repeatCount="indefinite" />
    </circle>
  </g>

  
  
  <path d="M0 0 H 100 V 900 H 0 Z" fill="#1B2340" opacity="0.6" />
  <path d="M0 0 H 50 V 900 H 0 Z" fill="#0B0F1A" opacity="0.8" />
  
  <path d="M1500 0 H 1600 V 900 H 1500 Z" fill="#1B2340" opacity="0.4" />
  
  <rect x="0" y="0" width="1600" height="30" fill="#0B0F1A" opacity="0.7" />

  
