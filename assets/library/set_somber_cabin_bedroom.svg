<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <defs>
    
    <linearGradient id="set_somber_cabin_bed-wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2340" />
      <stop offset="60%" stop-color="#3A2A66" />
      <stop offset="100%" stop-color="#C2603A" />
    </linearGradient>
    <linearGradient id="set_somber_cabin_bed-woodWall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3A2418" />
      <stop offset="50%" stop-color="#4A3222" />
      <stop offset="100%" stop-color="#3A2418" />
    </linearGradient>
    <linearGradient id="set_somber_cabin_bed-curtainGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1F6F6B" />
      <stop offset="70%" stop-color="#144A47" />
      <stop offset="100%" stop-color="#0E3331" />
    </linearGradient>
    <linearGradient id="set_somber_cabin_bed-amberGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F08A3C" />
      <stop offset="50%" stop-color="#C2603A" />
      <stop offset="100%" stop-color="#803418" />
    </linearGradient>
    <linearGradient id="set_somber_cabin_bed-floorGrad" x1="0" y1="0" x2="0" y2="1">
