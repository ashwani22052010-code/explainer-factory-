  </g>

  
  <rect x="0" y="0" width="1600" height="900" fill="url(#set_somber_cabin_bed-moonlight)" />

  
  <polygon points="0,650 1600,650 1600,900 0,900" fill="url(#set_somber_cabin_bed-floorGrad)" stroke="#3A2418" stroke-width="6" />
  
  <g stroke="#0B0F1A" stroke-width="3" opacity="0.7">
    <line x1="800" y1="650" x2="0" y2="900" />
