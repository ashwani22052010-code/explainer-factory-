      <stop offset="50%" stop-color="#1F6F6B" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1B2340" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="set_somber_cabin_bed-bedWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A3A26" />
      <stop offset="100%" stop-color="#2D1C12" />
